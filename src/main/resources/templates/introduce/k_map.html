<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <title>카카오 맵 - 마커에 인포윈도우 표시하기</title>
    <style>
        #map{
          width:100%;
          height:350px;
          max-width: 800px;
            margin: 20px auto;
        }
    </style>
</head>
<body>
<div id="map" style="width:100%;height:350px;"></div>

<script src="//dapi.kakao.com/v2/maps/sdk.js?appkey=7c6c22f6731f3751aec2f1ab30e544f0"></script>
<script>
let mapInitialized = false;
console.log("rr")

function initKakaoMap() {
    if (mapInitialized) return; // 이미 생성됐으면 종료
    mapInitialized = true;

    const mapContainer = $("#map");
	console.log(mapContainer)
    const mapOption = {
        center: new kakao.maps.LatLng(37.53921843188085, 127.07473196528314),
        level: 3
    };

    const map = new kakao.maps.Map(mapContainer, mapOption);

    const markerPosition = new kakao.maps.LatLng(37.53921843188085, 127.07473196528314);
    const marker = new kakao.maps.Marker({
        position: markerPosition
    });
    marker.setMap(map);

    const iwContent =
        '<div style="padding:5px;text-align:center;">건국대학교 부속동물병원<br>☎ 02-450-3664</div>';

    const infowindow = new kakao.maps.InfoWindow({
        content: iwContent
    });

    infowindow.open(map, marker);
}
</script>
</script>
</body>
</html>
