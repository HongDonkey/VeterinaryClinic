<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <script src="js/jquery-3.6.0.min.js"></script> <!--제이쿼리 호출-->
    <script src="js/header_animate.js"></script>
    <title>login prototype</title>
    <link rel="stylesheet" href="css/login_style.css">
    <link rel="stylesheet" href="css/ku_common.css">
    <link rel="preconnect" href="https://fonts.gstatic.com">
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@300&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://fonts.googleapis.com/icon?family=Material+Icons">
     <link rel="shortcut icon" href="img/main/site_favicon_02.png"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0, minimum-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    
</head>
<body>
 <div th:insert="~{fragments/login_header :: login_header}"></div>
     <!--end:header-->
  <div id="wrap_login">
    
    <div id="box" class="r_center">
        <div id="box_left">
            <figure><img src="img/login/login_icon.png" alt="login_icon"></figure>
            
            <div class="text">
            <strong>로그인</strong>
            <span>건국대학교 부속동물병원 홈페이지에 로그인을 하시면 다양한 서비스를 이용하실 수 있습니다.</span></div><!--text-->
        </div><!--box_left-->
        
        <div id="box_right">
         <div id="login_right">
          <form>
          <ul>
              <li><input type="text" name="id" id="id" placeholder="아이디를 입력해주세요" pattern="[a-z^0-9]{3,8}" title="영문자,숫자만 가능하며 9자미만으로 입력해주세요" required></li>
              <li><input type="password" name="pw" id="pw" placeholder="비밀번호를 입력해주세요" pattern="[a-z^0-9]{4-12}" title="영문자,숫자만 가능하며 13자미만으로 입력해주세요" maxlength="12" required></li>
          </ul>
            
            <div id="btn">
           <input type="submit" value="Login" id="ibtn" formaction="#" formmethod="post" formnovalidate>
            </div><!--btn-->
          
           </form>
           <!-- 카카오 로그인 버튼 추가 -->
		    <div id="social_login" style="margin-top:20px; text-align:center; display: flex; justify-content: center; gap: 10px;">
		       <a th:href="@{/login/kakao}">
				    <img th:src="@{/img/login/kakao_login_icon.png}"
				         alt="카카오 로그인">
				</a>
		        <a th:href="@{/login/naver}">
				    <img th:src="@{/img/login/naver_login_icon.png}"
				         alt="네이버 로그인">
				</a>
				<a th:href="@{/login/google}">
				    <img th:src="@{/img/login/google_login_icon.png}"
				         alt="구글 로그인">
				</a>
		    </div>
           <div class="join">
               <ul>
                   <li><a href=#>회원가입</a><span class="m_line"></span></li>
                    <li><a href=#>아이디 / 비밀번호 찾기</a></li>
               </ul>
           </div><!--join-->
         </div><!--login_right-->
        </div><!--box_right-->
    </div><!--box-->
    
    <div id="bg_gradation"> </div>
    
    </div><!--wrap_login-->
    <div th:replace="fragments/footer::footer"></div>
    <!--end:footer-->
</body>
</html>
