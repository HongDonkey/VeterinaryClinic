<!DOCTYPE html>
<html lang="ko">
<head>
	<div th:insert="~{fragments/commonLink :: commonLink}"></div>
    <script th:src="@{/js/sub1_2.js}"></script>
	<link th:href="@{/css/sub1_2.css}" rel="stylesheet">
    <title>진료예약</title>
    
<script th:inline="javascript">
	var loginMember = JSON.parse('[[${loginMember}]]');
	var deptList = JSON.parse('[[${deptList}]]');
	var now = new Date();

	var year  = now.getFullYear();
	var month = String(now.getMonth() + 1).padStart(2, '0');
	var day   = String(now.getDate()).padStart(2, '0');

	var today = year + "-" + month + "-" + day;
	
	
    $(document).ready(function () {
    	$("#btd").val(today); //오늘 날짜로 default
    	
	    if (loginMember) {
	    	var phone = loginMember.phone;
	    	var mail = loginMember.mail;    
	    	if(phone){ 
	        var [ph1, ph2, ph3] = phone.split("-");
	
		       if (ph1 && ph2 && ph3) {
		       	$("#ph1").val(ph1).prop("disabled", true);
		       	$("#ph2").val(ph2).prop("disabled", true);
		       	$("#ph3").val(ph3).prop("disabled", true);
	
		       	$("#ph1_mb").val(ph1).prop("disabled", true);
		       	$("#ph2_mb").val(ph2).prop("disabled", true);
		       	$("#ph3_mb").val(ph3).prop("disabled", true);
		       }
	        }
	    	if(mail){
	    		$("#mail").val(mail).prop("disabled", true)
	    	}
	    }
	    

			// 첫번째 동물 자동 체크 + API 호출
			const firstAnimal = $('input[name="animalType"]').first();
			firstAnimal.prop('checked', true);
			changeKind(firstAnimal.val());
	
			// 첫번째 진료과목 자동 체크 + API 호출
			const firstDept = $('input[name="doctorType"]').first();
			firstDept.prop('checked', true);
			changeDoctors(firstDept.val());
	    
    });
    function changeKind(animal) {
    	const $select = $("#kindSelect");
   	    const $etcInput = $("#kindEtcInput");

   	    // 공통 초기화
   	    $select.empty().append('<option value="">선택하세요</option>');
   	    $etcInput.hide().val("");
     	var url = '';
     	 if (animal === 'etc') {

             $select.hide();          // 숨김
             $select.prop("disabled", true);   // 🔥 비활성화 추가
             $etcInput.show();

             return;
         }

         $select.show();
         $select.prop("disabled", false);  // 🔥 다시 활성화

         if (animal === 'cat') {
             url = '/reservation/cats';
         } else if (animal === 'dog') {
             url = '/reservation/dogs';
         }
		
        $.ajax({
            url: url,
            type: 'GET',
            success: function (animalList) {
                const $select = $("#kindSelect");
                

                $.each(animalList, function (idx, animal) {
                    $select.append(
                        `<option value="${animal.cd}">
                            ${animal.description}
                         </option>`
                    );
                });
            },
            error: function () {
                /* alert('의사 목록 조회 실패'); */
            }
        });
    }
    
    function changeDoctors(dept) {
        $.ajax({
            url: '/reservation/doctors',
            type: 'GET',
            data: { dept: dept },
            success: function (doctorList) {
                const $select = $("#doctorSelect");
                $select.empty();
                $select.append('<option value="">선택하세요</option>');

                $.each(doctorList, function (idx, doctor) {
                    $select.append(
                        `<option value="${doctor.id}">
                            ${doctor.name} 교수
                         </option>`
                    );
                });
            },
            error: function () {
                /* alert('의사 목록 조회 실패'); */
            }
        });
    }
    
    function checkValidation(){
    	const animalType = $('input[name="animalType"]:checked').val();
        const doctorType = $('input[name="doctorType"]:checked').val();
        const kind = $("#kindSelect").prop("disabled") 
                        ? $("#kindEtcInput").val()
                        : $("#kindSelect").val();

        const doctor = $("#doctorSelect").val();
        const date = $("#btd").val();
        const hour = $("#hour").val();
        const minute = $("#minute").val();
        const title = $("#title").val();
        const contents = $("#contents").val();

        const phone =
            $("#ph1").val() + "-" +
            $("#ph2").val() + "-" +
            $("#ph3").val();
        


        const mail = $("#mail").val();
        

        
        if (!animalType) return alert("동물을 선택하세요.");
        if (!kind) return alert("품종을 입력하세요.");
        if (!doctorType) return alert("진료과목을 선택하세요.");
        if (!doctor) return alert("의료진을 선택하세요.");
        if (!date) return alert("희망진료일을 선택하세요.");
        if (!title) return alert("제목을 입력하세요.");
        if (!contents) return alert("내용을 입력하세요.");
        if (!hour || !minute) return alert("희망진료시간을 선택하세요.");
        if (!$("#ph1").val().trim() || !$("#ph2").val().trim() || !$("#ph3").val().trim()) return alert("연락처를 입력하세요.");
        if (!mail) return alert("메일을 입력하세요.");
        
        const phonePattern = /^01[016789]-\d{3,4}-\d{4}$/;
        if (!phonePattern.test(phone)) {
            return alert("올바른 연락처 형식이 아닙니다. (예: 010-1234-5678)");
        }
        
        const emailPattern = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;
        if (!emailPattern.test(mail)) {
            return alert("올바른 이메일 형식이 아닙니다.");
        }

    }
    
    function reservation(){
		
    	checkValidation();
		
        const requestData = {
            animalType: $('input[name="animalType"]:checked').val(),
            kind: $("#kindSelect").prop("disabled") 
            		? $("#kindEtcInput").val()
                    : $("#kindSelect").val(),
            doctorType: $('input[name="doctorType"]:checked').val(),
            doctorId: $("#doctorSelect").val(),
            date: $("#btd").val(),
            time: $("#hour").val() + $("#minute").val(),
            title: $("#title").val(),
            contents: $("#contents").val(),
            phone: $("#ph1").val() + "-" +
		            $("#ph2").val() + "-" +
		            $("#ph3").val(),
            mail: $("#mail").val(),
        };

        console.log("📌 저장 데이터:", requestData);

        $.ajax({
            url: "/reservation/save",
            type: "POST",
            contentType: "application/json",
            data: JSON.stringify(requestData),
            success: function () {
                alert("예약이 완료되었습니다.");
                location.href = "/reservation/list"; // 성공 후 이동
            },
            error: function () {
                alert("예약 저장 실패");
            }
        });
    
    }
</script>
   
</head>
<body>
   <div th:insert="~{fragments/header :: header}"></div>     
      
    
    <!--서브 네비게이션-->  
    <div th:insert="~{fragments/sub1 :: sub1}"></div>

    <!--서브 상단 제목-->
    <div id="sub_top_t_wrap" class="row_center">
        <h3 class="sub_top_t">진료예약</h3>
        
        <div class="sub_top_box">
           <figure><img src="img/sub/sub_common/circle.png" alt="포인트1"></figure>
            <div class="sub_top_t_all">
            <p><span class="material-icons">arrow_right</span>당일 예약시간 20분 전에 내원하여 원무행정팀에 방문 접수 후 진료 받으시기 바랍니다.</p>
            <p><span class="material-icons">arrow_right</span>예약 변경/취소는 진료 1일전까지 꼭 연락 주시기 바랍니다.</p>
            <p><span class="material-icons">arrow_right</span>진료 예약확인은 1599-3664 ARS 1번을 이용하시거나, 홈페이지 예약조회에서 확인 가능합니다.</p>
            </div>    
        </div>
    </div>
    
    <!--진료예약_sub1_2_content-->
    <div id="s1_2_con_wrap" class="row_center">
         <div id="container">
        <ul class="tab"> <!--탭버튼-->
            <li th:if="${loginMember != null}">회원 진료예약</li>
            <li th:if="${loginMember == null}">비회원 진료예약</li>
        </ul>
        </div><!--container////////-->
        
        <div id="s1_2_all">
        <div class="join_member">
           <div class="join_m_t"><!--상단타이틀-->
           <figure><img src="img/sub/sub1_m_sch/sub1_2/join_m.png" alt="회원아이콘"></figure>
			<h3 th:text="${loginMember != null ? '회원 예약진료' : '비회원 예약진료'}">
			    회원 예약진료
			</h3>
           </div> 
            
            <form id="member_join"><!--회원가입칸--> 
                <table>
                    <!-- <tr class="id">
                        <th>아이디</th>
                        <td><input type="text" name="id" class="zip" id="id" pattern="[a-z^0-9^A-Z]{2,8}" title="영문자,숫자와 8자미만 입력하세요" requierd>
                        </td>
                    </tr> -->
          			<tr class="id">
                        <th>메일</th>
                        <td>
                        <input type="text" name="mail" class="zip" id="mail">
                        </td>
                    </tr>
                    <tr>
                        <th>핸드폰 번호</th>
                        <td class="ph_num" ><input type="text" name="ph1" id="ph1" class="form_2" maxlength="3" title="연락처 첫번째자리">
                        <span>―</span>
                        <input type="text" name="ph2" id="ph2" class="form_2" maxlength="4" title="연락처 중간자리">
                        <span>―</span>
                        <input type="text" name="ph3" id="ph3" class="form_2" maxlength="4" title="연락처 마지막자리">    
                        </td>
                        
                        <td class="ph_num_mb"><input type="text" name="ph1" id="ph1_mb" class="form_2" maxlength="3" placeholder="핸드폰 앞번호" title="연락처 첫번째자리">
        
                        <input type="text" name="ph2" id="ph2_mb" class="form_2" maxlength="4" title="연락처 중간자리">
         
                        <input type="text" name="ph3" id="ph3_mb" class="form_2" maxlength="4" title="연락처 마지막자리">    
                        </td>
                    </tr>
					<tr>
                         <th>동물 선택</th>
						    <td class="list_radio">
						        <ul class="care_sb" id="radioKind">
						        <li>
								    <input type="radio" name="animalType" value="dog" id="dog" onChange="changeKind(this.value)">
								    <label for="dog">강아지</label>
								  </li>
								  <li>
								    <input type="radio" name="animalType" value="cat" id="cat" onChange="changeKind(this.value)">
								    <label for="cat">고양이</label>
								  </li>
								  <li>
								    <input type="radio" name="animalType" value="etc" id="etc" onChange="changeKind(this.value)">
								    <label for="etc">기타</label>
								  </li>
						        </ul>
						    </td>
                    </tr>
                    <tr class="list_result">
                        <th>품종</th>
                        <td class="result_doc"> 
				        <select name="kind"
				                class="zip"
				                id="kindSelect"
				                >
				            <option value="">선택하세요</option>
				        </select>
                        <!-- 기타 선택 시 표시 -->
				        <input type="text"
				               id="kindEtcInput"
				               name="kindEtc"
				               placeholder="품종을 직접 입력하세요"
				               >
                        </td>
                    </tr>
                    
                    <tr>
                         <th>진료과목</th>
						    <td class="list_radio">
						        <ul class="care_sb" id="radioDept">
						            <li th:each="dept : ${deptList}">
						                <input type="radio"
						                       name="doctorType"
						                       th:id="${dept.acro}"
						                       th:value="${dept.acro}"
						                       onChange="changeDoctors(this.value)">
						                       
						                <label th:for="${dept.acro}"
						                       th:text="${dept.name}">
						                    진료과목
						                </label>
						            </li>
						        </ul>
						    </td>
                    </tr>
                    
                    <tr class="list_result">
                        <th>의료진</th>
                        <td class="result_doc"> 
				        <select name="doctor"
				                class="doctor"
				                id="doctorSelect"
				                >
				            <option value="">선택하세요</option>
				        </select>
                        
                        </td>
                    </tr>
                    
                    <tr>
                        <th>희망진료일</th>
                        <td><input type="date" name="btd" class="zip" id="btd" requierd></td>
                    </tr>
                    
                    <tr>
                        <th>진료시간</th>
                        <td><select name="time" class="time_h" id="hour" requierd>
                        <option value="" selected>시간 선택</option>
                        <option value="10">10시</option>
                        <option value="11">11시</option>
                        <option value="12">12시</option>
                        <option value="14">14시</option>
                        <option value="15">15시</option>
                        <option value="16">16시</option>
                        <option value="17">17시</option>
                         </select>
                         
                         <select name="time" class="time_m" id="minute" requierd>
                        <option value="" selected>분 선택</option>
                        <option value="00">00분</option>
                        <option value="30">30분</option>
                         </select>
                         </td>
                    </tr>
                    
                    <tr>
                        <th>제목</th>
                        <td><input type="text" name="title" class="title" id="title"></td>
                    </tr>
                    
                    <tr>
                        <th>예약내용</th>
                        <td>
                        <textarea name="texts" class="texts" id="contents"></textarea></td>
                    </tr>
                    
                </table>
            </form> 
             <div class="s1_2_btn">
             <button type="button" class="button" onclick="reservation()">예약하기</button>
             
              <button class="button_c"><a href="KU_VM_TH_main.html">취소</a></button>
             </div>
            
        </div><!--join_member/////////-->
 
        </div><!--s1_2_all-->
   
    
    </div><!--s1_2_con_wrap-->
           
          
           
         
           
               
        
  <div th:insert="~{fragments/footer :: footer}"></div>  

</body>
</html>
